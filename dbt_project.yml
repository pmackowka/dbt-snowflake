
# Główny plik konfiguracyjny projektu dbt: nazwa, profil, ścieżki folderów, domyślna
# materializacja PER FOLDER (view/table/ephemeral), hook post-hook nadający dostęp roli
# REPORTER (patrz README.md -> Setup -> 1. Snowflake) i zmienna user_name (macros/*variable*).

# Nazwa projektu - tylko małe litery i podkreślenia, musi się zgadzać z kluczem najwyższego
# poziomu w profiles.yml (patrz profil poniżej).
name: 'snowflake_project'
version: '1.0.0'

# Profil, którego dbt użyje do połączenia z bazą - musi mieć odpowiednik w profiles.yml.
profile: 'snowflake_project'

# Ścieżki do folderów z poszczególnymi typami plików projektu.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
asset-paths: ["assets"]  # obrazy osadzane w dokumentacji (dbt docs)

clean-targets:         # foldery usuwane przez `dbt clean`
  - "target"
  - "dbt_packages"


# Konfiguracja domyślnej materializacji per folder - nadpisywalna per model przez
# {{ config(...) }} w samym pliku .sql (patrz np. models/fct/fct_reviews.sql).
models:
  snowflake_project:
    # view jako domyślna materializacja PROJEKTU (nie table jak w siostrzanym repo
    # dbt-bigquery): świadomie inny punkt startowy - większość modeli w tym projekcie to proste
    # przekształcenia bez kosztownych agregacji, więc przeliczanie na bieżąco (widok) jest tańsze
    # niż trzymanie i regularne nadpisywanie fizycznej tabeli, której nikt nie musi czytać wprost.
    +materialized: view
    # post-hook uruchamia się automatycznie po zbudowaniu KAŻDEGO modelu - bez tego trzeba by
    # ręcznie odtwarzać GRANT po każdym dbt run, bo dbt nadpisuje/tworzy obiekty od nowa
    +post-hook:
      - "GRANT SELECT ON {{ this }} TO ROLE REPORTER"
    dim:
      # table dla wymiarów: dim_listings_w_hosts i dim_hosts_cleansed są odpytywane bezpośrednio
      # przez dashboardy (patrz models/dashboards.yml) - fizyczna tabela czyta się szybciej niż
      # widok przeliczany od zera przy każdym zapytaniu BI.
      +materialized: table
    src:
      # ephemeral dla staging: modele src_* to tylko rename kolumn z surowych tabel (patrz
      # models/src/*.sql), używane wyłącznie jako CTE wewnątrz modeli dim/fct - nie ma sensu
      # trzymać ich jako osobny obiekt w bazie, skoro nikt nie odpytuje ich wprost.
      +materialized: ephemeral

vars:
  # Wartość domyślna dla var("user_name", ...) używanego w macros/logging.sql i
  # macros/variable_test.sql - pozwala nadpisać ją z CLI (--vars) bez zmiany kodu makra,
  # patrz README/notatka sekcja 12.
  user_name: "PIOTR"
