# Konfiguracja projektu: materializacja per folder, grants dla REPORTER w prod, snapshoty
# permanentne, zmienna user_name.

# Nie 'dbt_snowflake' - ta nazwa koliduje z wewnętrznym pakietem makr adaptera.
name: 'snowflake_project'
version: '1.0.0'

# Musi mieć odpowiednik (klucz najwyższego poziomu) w profiles.yml.
profile: 'snowflake_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
asset-paths: ["assets"]  # obrazy osadzane w dokumentacji (dbt docs)

clean-targets:         # foldery usuwane przez `dbt clean`
  - "target"
  - "dbt_packages"

# Materializacja per folder; config() w pliku .sql ma pierwszeństwo (fct_reviews, full_moon_reviews).
models:
  snowflake_project:
    # view to default tylko dla modeli spoza dim/ i src/ - dziś żaden z niego nie korzysta
    # (manifest: dim = table, src = ephemeral, fct i mart nadpisują w config()). Nowy model
    # w nowym folderze startuje więc jako widok: bez storage, płaci się dopiero przy odczycie.
    +materialized: view
    # Natywne grants zamiast post-hooka z GRANT: dbt porównuje stan z deklaracją i odbiera
    # uprawnienia dodane ręcznie. Tylko prod - GRANT do nieistniejącej roli wywraca build, a dev
    # nie potrzebuje BI. Kto czyta, rozstrzyga rola REPORTER w Snowflake, nie dbt.
    +grants: "{{ {'select': ['REPORTER']} if target.name == 'prod' else {} }}"
    dim:
      # table: dim_listings_w_hosts czyta dashboard (models/dashboards.yml), a *_cleansed czytają
      # join w w_hosts i kilkanaście testów - widok liczyłby to samo przy każdym odczycie.
      # Tabele są transient (default adaptera) - odbudowują się ze źródła, Fail-safe zbędny.
      +materialized: table
    src:
      # ephemeral: src_* to rename kolumn, wklejany jako CTE do dim/fct - bez obiektu w bazie.
      +materialized: ephemeral

vars:
  # Default dla var("user_name") w macros/variable_test.sql i learn_variables.sql - nadpisywalny
  # przez --vars bez zmiany kodu makra.
  user_name: "PIOTR"

snapshots:
  snowflake_project:
    # Adapter tworzy każdą tabelę jako transient (parse_model.is_transient: domyślnie True): bez
    # Fail-safe, Time Travel maks. 1 dzień. Modele odbuduje się ze źródła, historii SCD2 nie -
    # to jedyna kopia. Istniejąca tabela typu nie zmieni: snapshot jej nie odtwarza (CTAS ręcznie).
    +transient: false
