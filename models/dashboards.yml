# Exposure: deklaracja, że dashboard zależy od modeli dbt. Nie materializuje się, ale trafia do
# lineage w dbt docs - widać, co zepsuje zmiana dim_listings_w_hosts albo full_moon_reviews.
# Deklaracja, nie bramka: dbt nie sprawdza, czy dashboard istnieje ani kto go czyta. Dostęp to
# rola REPORTER (grants w prod), a ochronę kolumn daje kontrakt na full_moon_reviews. url to placeholder.
version: 2

exposures:
  - name: executive_dashboard
    label: Executive Dashboard
    type: dashboard
    maturity: low
    url: https://example.preset.io/superset/dashboard/123
    description: Executive Dashboard about Airbnb listings and hosts

    depends_on:
      - ref('dim_listings_w_hosts')
      - ref('full_moon_reviews')

    owner:
      name: Piotr Maćkówka
