# Testy modeli dim/fct. Domyślna severity to error (brak +severity w dbt_project.yml), więc
# padnięty test zatrzymuje modele zależne w dbt build. Klucze pod joinami mają unique/not_null.
# dim_listings_w_hosts: dbt_expectations - liczba wierszy równa źródłu (utracone lub zwielokrotnione
# wiersze po joinie), kwantyle jako wykrywanie outlierów.
version: 2

models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    columns:

      - name: listing_id
        description: Primary key for the listing
        tests:
          - unique
          - not_null

      - name: host_id
        description: The hosts's id. References the host table.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        tests:
          - positive_value

  - name: dim_hosts_cleansed
    description: Cleansed table for the Airbnb hosts
    columns:
      - name: host_id
        description: The id of the host. This is the primary key.
        tests:
          - not_null
          - unique

      - name: host_name
        description: The name of the host
        tests:
          - not_null

      - name: is_superhost
        description: Defines whether the hosts is a superhost.
        tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null

      - name: price
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000
              config:
                # Luksusowa oferta to nie błąd danych. Deklaracja, nie bramka: warn to exit code 0 i wpis
                # w logu - bez --store-failures i alertu nikt go nie zobaczy.
                severity: warn

  - name: fct_reviews
    columns:
      - name: review_id
        description: Surrogate key recenzji, unique_key MERGE-a w fct_reviews.sql
        tests:
          - unique
          - not_null

      - name: listing_id
        tests:
          - not_null  # relationships pomija NULL-e, więc bez tego osierocona recenzja przechodzi
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: reviewer_name
        tests:
          - not_null

      - name: review_sentiment
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']

  - name: full_moon_reviews
    description: Recenzje z flagą nocy po pełni - publiczny mart pod executive_dashboard.
    config:
      # Bramka, ale wąska: dbt przed buildem porównuje nazwy i typy kolumn (kolejność z YAML =
      # kolejność w tabeli) i pada przy rozjeździe. Snowflake egzekwuje z constraintów tylko
      # NOT NULL - unikalność review_id pilnuje test na fct_reviews, nie kontrakt.
      contract:
        enforced: true
    columns:
      - name: review_id
        data_type: varchar
        constraints:
          - type: not_null
      - name: listing_id
        data_type: number
        constraints:
          - type: not_null
      - name: review_date
        data_type: timestamp_ntz
      - name: reviewer_name
        data_type: varchar
      - name: review_text
        data_type: varchar
      - name: review_sentiment
        data_type: varchar
      - name: is_full_moon
        data_type: varchar
