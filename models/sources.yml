# Definicja source() - surowych tabel w schemacie AIRBNB.RAW (patrz README.md -> Setup -> 1.
# Snowflake -> import danych z S3). identifier: pozwala nazwać źródło inaczej niż fizyczna nazwa
# tabeli w bazie (przyjazne "listings" zamiast "raw_listings") - modele odwołują się przez
# source('airbnb', 'listings'), nie przez surową nazwę tabeli.
version: 2

sources:
  - name: airbnb
    schema: raw
    tables:
      - name: listings
        identifier: raw_listings

      - name: hosts
        identifier: raw_hosts

      - name: reviews
        identifier: raw_reviews
        config:
          loaded_at_field: date
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}