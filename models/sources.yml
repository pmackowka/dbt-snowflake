# Surowe tabele w AIRBNB.RAW (import z S3 -> README.md -> Setup). identifier: modele wołają
# source('airbnb', 'listings'), a fizyczna nazwa raw_listings żyje tylko tutaj.
version: 2

sources:
  - name: airbnb
    schema: raw
    tables:
      - name: listings
        identifier: raw_listings

      - name: hosts
        identifier: raw_hosts

      - name: reviews
        identifier: raw_reviews
        config:
          # Freshness tylko tu: przy strumieniu recenzji data recenzji przybliża moment dopływu,
          # a listings/hosts nie mają pola, które by to robiło (updated_at to zmiana oferty).
          # Przy jednorazowym imporcie z S3 wynik po dobie zawsze będzie error - to oczekiwane.
          # Deklaracja, nie bramka: dbt build freshness NIE sprawdza (brak Source w RUNNER_MAP
          # dbt/task/build.py). To osobna komenda `dbt source freshness` i bramka w orkiestracji.
          loaded_at_field: date
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}
