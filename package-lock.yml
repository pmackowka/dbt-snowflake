# Plik generowany automatycznie przez `dbt deps` - zapisuje DOKŁADNE, przetestowane wersje
# pakietów, w tym zależności TRANZYTYWNE (dbt_date poniżej nie jest w packages.yml wprost -
# to zależność samego dbt_expectations, dbt deps rozwiązuje ją automatycznie). Commitowany
# celowo (jak package-lock.json w npm), żeby `dbt deps` na innym komputerze zainstalował
# identyczne wersje, nie cokolwiek najnowszego pasującego do zakresu w packages.yml.
#
# `dbt deps` NIE nadpisuje tego pliku, dopóki packages.yml się nie zmieni (sha1_hash poniżej to
# hash zawartości packages.yml) - ten komentarz przetrwa zwykłe `dbt deps`, zniknie dopiero przy
# faktycznej zmianie wersji pakietu.
packages:
  - name: dbt_utils
    package: dbt-labs/dbt_utils
    version: 1.4.1
  - name: dbt_expectations
    package: metaplane/dbt_expectations
    version: 0.10.10
  - name: codegen
    package: dbt-labs/codegen
    version: 0.14.1
  - name: dbt_date
    package: godatadriven/dbt_date
    version: 0.21.0
sha1_hash: ff6e5c877338b64aa48d5c412eae3bc6607282a8
