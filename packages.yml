# Pakiety dbt - dbt deps instaluje je do dbt_packages/ i zapisuje dokładne wersje w package-lock.yml.
# dbt_utils: generate_surrogate_key (fct_reviews.sql), dbt_expectations: testy w models/schema.yml.
# Bez dbt-labs/codegen: nie miał konsumenta w kodzie. dbt nie dzieli zależności na dev/prod, więc
# zasada: każdy pakiet tutaj ma konsumenta w kodzie.
packages:
  - package: dbt-labs/dbt_utils
    version: 1.4.1

  # calogica/dbt_expectations jest zarchiwizowany - metaplane/dbt_expectations to aktywny fork
  - package: metaplane/dbt_expectations
    version: 0.10.10
