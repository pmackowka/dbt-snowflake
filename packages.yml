# Zależności zewnętrzne (pakiety dbt) - dbt deps instaluje je do dbt_packages/ (gitignore) na
# podstawie tego pliku i zapisuje dokładne wersje w package-lock.yml. dbt_utils dostarcza
# generate_surrogate_key (fct_reviews.sql, macros/no_nulls_in_columns.sql), dbt_expectations to
# testy inspirowane Great Expectations (models/schema.yml - deep dive w notatce, sekcja 10).
packages:
  - package: dbt-labs/dbt_utils
    version: 1.4.1

  - package: metaplane/dbt_expectations
    version: 0.10.10

  - package: dbt-labs/codegen
    version: 0.14.1
